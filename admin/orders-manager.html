<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Manager - FitBox Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../backend.css">
    <link rel="stylesheet" href="css/orders.css">
</head>
<body>

<div class="main-content">
    <header>
        <div class="header-left">
            <div class="title-group">
                <div class="breadcrumb">Orders / Order Management</div>
                <h1>Order Manager</h1>
                <p class="header-subtitle">Manage the full lifecycle of customer orders and fulfillment states</p>
            </div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search by ID or customer..." onkeyup="filterOrders(this)">
            </div>
        </div>
        <div class="header-actions">
            <button class="btn-primary" onclick="loadOrders()"><i class="fa-solid fa-rotate"></i> Sync Orders</button>
        </div>
    </header>

    <!-- ORDERS TABLE -->
    <div class="data-section">
        <div class="section-header">
            <h2>All Orders</h2>
            <p id="orderCountLabel" class="section-subtitle">0 orders found</p>
        </div>
        <table id="ordersTable">
            <thead>
                <tr>
                    <th>ORDER ID</th>
                    <th>CUSTOMER</th>
                    <th>ITEMS SUMMARY</th>
                    <th>TOTAL AMOUNT</th>
                    <th>STATUS</th>
                    <th>UPDATE STATUS</th>
                    <th>DATE</th>
                </tr>
            </thead>
            <tbody>
                <!-- Dynamic Content -->
            </tbody>
        </table>
    </div>
</div>

<script src="../shared-admin.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        loadOrders();
    });

    async function loadOrders() {
        const res = await fetch(`${API_URL}/admin/orders`);
        const data = await res.json();
        const tbody = document.querySelector('#ordersTable tbody');
        document.getElementById('orderCountLabel').textContent = `${data.length} orders found`;
        
        tbody.innerHTML = data.map(o => `
            <tr>
                <td>#${o.id}</td>
                <td><b>${o.customer_name || 'Guest'}</b></td>
                <td style="max-width:250px;"><small>${o.items_summary}</small></td>
                <td><b>GH₵ ${o.total_amount}</b></td>
                <td><span class="badge ${o.status}">${o.status}</span></td>
                <td>
                    <select class="action-btn" onchange="updateStatus(${o.id}, this.value)">
                        <option value="">Update...</option>
                        <option value="pending" ${o.status === 'pending' ? 'selected' : ''}>Pending</option>
                        <option value="processing" ${o.status === 'processing' ? 'selected' : ''}>Processing</option>
                        <option value="shipped" ${o.status === 'shipped' ? 'selected' : ''}>Shipped</option>
                        <option value="delivered" ${o.status === 'delivered' ? 'selected' : ''}>Delivered</option>
                        <option value="cancelled" ${o.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
                    </select>
                </td>
                <td>${new Date(o.created_at).toLocaleDateString()}</td>
            </tr>
        `).join('');
    }

    async function updateStatus(id, status) {
        if(!status) return;
        await fetch(`${API_URL}/admin/orders/${id}/status`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status })
        });
        loadOrders();
    }

    function filterOrders(input) {
        const filter = input.value.toUpperCase();
        const rows = document.getElementById("ordersTable").getElementsByTagName("tr");
        for (let i = 1; i < rows.length; i++) {
            const text = rows[i].textContent.toUpperCase();
            rows[i].style.display = text.indexOf(filter) > -1 ? "" : "none";
        }
    }
</script>

</body>
</html>
